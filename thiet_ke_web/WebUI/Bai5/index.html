<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel ="stylesheet" href="main.css">
</head>
<body>
    <div class="header-grid-container">


        <div class="logo-container">
            <img class="logo" src="logo3.png" alt="Logo">
        </div>

        <div class="search-container">
            <input type="text" class="search-input">
            <button class="search-button">Search</button>
         </div>

         <div class="cart-account-container">
            <button class="account-button">Tài khoản</button>
            <button class="cart-button">Giỏ hàng</button>
         </div>

    </div>


    <div class="all-catorgory-container">
        <div class="item-category-container">
            <img class="img-category" src="cat1.png" alt="Category 1">
            <p class="name-category">Ngọc ánh sao</p>
        </div>
        <div class="item-category-container">
            <img class="img-category" src="cat2.png" alt="Category 2">
            <p class="name-category">Vé tinh cầu</p>
        </div>
        <div class="item-category-container">
            <img class="img-category" src="cat3.png" alt="Category 3">
            <p class="name-category">Vé tinh cầu đặc biệt</p>
        </div>
        <div class="item-category-container">
            <img class="img-category" src="cat4.png" alt="Category 4">
            <p class="name-category">Nhiên liệu</p>
        </div>
    </div>





    <div class="all-products-container">
        <div class="item-products-container">
                <img class="product-image" src="sp2.png" alt="Product 1">
                <h3 class="product-tittle">10 tỷ</h3>
                <p class="product-price">$10.00</p>

        </div>    
        <div class="item-products-container">
                <img class="product-image" src="sp2.png" alt="Product 1">
                <h3 class="product-tittle">20 tỷ</h3>
                <p class="product-price">$10.00</p>

        </div>  
        <div class="item-products-container">
                <img class="product-image" src="sp2.png" alt="Product 1">
                <h3 class="product-tittle">30 tỷ</h3>
                <p class="product-price">$10.00</p>

        </div>  
        <div class="item-products-container">
                <img class="product-image" src="sp2.png" alt="Product 1">
                <h3 class="product-tittle">40 tỷ</h3>
                <p class="product-price">$10.00</p>

        </div>  
    </div>

    </div>
      <div class="footer">
        <p>Giờ đóng shop : NONE </p>
        <p>Thứ 2 Đến Chủ Nhật</p> 
        <p>Uy tín, trách nhiệm, hỗ trợ khách hàng</p>
    </div>

</body>
</html>
