                <div class="quickViewMainImage">
                    <button type="button" class="quickViewImageNav quickViewPrevImageBtn" id="quickViewPrevImageBtn" aria-label="Ảnh trước">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>

                    <img src="" alt="" id="quickViewImage">

                    <button type="button" class="quickViewImageNav quickViewNextImageBtn" id="quickViewNextImageBtn" aria-label="Ảnh sau">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>

                <div class="quickViewOption">
                    <div class="quickViewOptionTop">
                        <span>Kích thước</span>
                    </div>

                    <div class="quickViewSizeList" id="quickViewSizeList">
                        
                    </div>
                </div>

                <div class="quickViewOption">
                    <div class="quickViewOptionTop">
                        <span>Số lượng</span>
                    </div>

                    <div class="quickViewQuantityBox">
                        <button type="button" id="quickViewMinusQty" aria-label="Giảm số lượng">
                            -
                        </button>

                        <input type="number" id="quickViewQuantityInput" value="1" min="1" readonly>

                        <button type="button" id="quickViewPlusQty" aria-label="Tăng số lượng">
                            +
                        </button>
                    </div>
                </div>

                <button type="button" class="quickViewBuyBtn" id="quickViewBuyBtn">
                    Sở hữu ngay
                </button>

                <div class="quickViewMoreInfo">
                    <button type="button" class="quickViewToggleBtn" data-action="toggle-material">
                        <span>Chất liệu sản phẩm</span>
                        <i class="fa-solid fa-plus"></i>
                    </button>

                    <div class="quickViewToggleContent" id="quickViewMaterial" hidden>
                        Nội dung chất liệu sản phẩm.
                    </div>

                    <button type="button" class="quickViewToggleBtn" data-action="toggle-description">
                        <span>Mô tả sản phẩm</span>
                        <i class="fa-solid fa-plus"></i>
                    </button>

                    <div class="quickViewToggleContent" id="quickViewDescription" hidden>
                        Nội dung mô tả sản phẩm.
                    </div>
                </div>

                <a href="#" class="quickViewDetailLink" id="quickViewDetailLink">
                    Xem chi tiết sản phẩm &gt;&gt;
                </a>
            </div>
        </div>
    </section>

                <span>Tổng tiền tạm tính:</span>

            </div>

            <button type="button" class="cartDrawerCheckoutBtn" id="cartDrawerCheckoutBtn">
                Tiến hành đặt hàng
            </button>

            <a href="../html/cart.html" class="cartDrawerDetailLink" id="cartDrawerDetailLink">
                Xem chi tiết giỏ hàng
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
